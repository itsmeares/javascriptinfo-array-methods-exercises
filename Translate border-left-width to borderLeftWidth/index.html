<script>

  function camelize(str) {
    const removeDashes = str.split("-")
    const intoCamelCase = removeDashes
        .slice(1)
        .map((str) => str.charAt(0).toUpperCase() + str.slice(1));

    // take out original first item and put it at the index 0 in the array
    const originalFirstItem = removeDashes.shift()
    intoCamelCase.unshift(originalFirstItem)

    const result = intoCamelCase.join("")
    return result;
  }
